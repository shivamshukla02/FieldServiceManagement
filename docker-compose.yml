services:
  postgres:
    image: postgres:16
    container_name: keystone-db
    environment:
      POSTGRES_DB: keystone
      POSTGRES_USER: keystone_user
      POSTGRES_PASSWORD: keystone_pass
    ports:
      - "5432:5432"
    volumes:
      - keystone_pgdata:/var/lib/postgresql/data
volumes:
  keystone_pgdata: